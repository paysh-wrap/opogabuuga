# Paytience on a cloud server with your own domain (docs/DEPLOY.md). Start: `make server-up`.
# Only Caddy is reachable from the internet (ports 80/443): it gets and renews the HTTPS certificate for
# PAYTIENCE_DOMAIN automatically and asks for the edge login before anything except the TradingView webhook.
# The API, worker and Redis have NO published ports: they are only reachable on the private Docker network.
name: paytience

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PAYTIENCE_DOMAIN: ${PAYTIENCE_DOMAIN:?set PAYTIENCE_DOMAIN in .env (deploy/setup.sh does it)}
      PAYTIENCE_EDGE_USER: ${PAYTIENCE_EDGE_USER:?set PAYTIENCE_EDGE_USER in .env}
      PAYTIENCE_EDGE_HASH: ${PAYTIENCE_EDGE_HASH:?set PAYTIENCE_EDGE_HASH in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates (keep: Let's Encrypt limits re-issuing)
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  api: &app
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: paytience-app
    restart: unless-stopped
    env_file: .env
    environment: &appenv
      PAYTIENCE_ENV: prod
      PAYTIENCE_DATABASE_URL: sqlite:////data/paytience.db
      PAYTIENCE_REDIS_URL: redis://redis:6379/0
      PAYTIENCE_RULES_PATH: /app/config/rules/${PAYTIENCE_PLAN:-lucid_flex_25k}.yaml   # same default as the desktop app
      PAYTIENCE_TA_PYTHON: /opt/ta/bin/python
      PAYTIENCE_WEB_DIST: /app/web
      PAYTIENCE_PUBLIC_URL: https://${PAYTIENCE_DOMAIN}   # TradingView webhook base + mandatory "public HTTPS URL"
      PAYTIENCE_COOKIE_SECURE: "true"          # session cookie only over HTTPS
      PAYTIENCE_FORWARDED_ALLOW_IPS: "*"       # safe here: only Caddy can reach the API (no published port)
      PAYTIENCE_ALLOW_LIVE: ${PAYTIENCE_ALLOW_LIVE:-false}   # §1.5: PAPER unless you set it AND pass every live gate
    volumes: ["paytience-data:/data"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on: [redis]

  worker:
    <<: *app
    command: ["arq", "app.workers.jobs.WorkerSettings"]
    expose: []
    healthcheck: { disable: true }
    depends_on: [redis, api]

volumes:
  paytience-data:   # database + stored (encrypted) keys + logs: back it up with `make server-backup`
  caddy-data:
  caddy-config:
