  check_time: "Fri 17:05"
  sweep_above: 112100
  skim_mode: half                      # half | off
  block_trading_while_pending: true

purchase_gate: {min_trades: 100, min_e_net_r: 0.20, min_pf: 1.4, max_violations: 0, demo_days: 2, semi_auto_sessions: 5}

