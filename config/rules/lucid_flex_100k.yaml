# Paytience rule profile — Lucid Trading LucidFlex 100K
# From Lucid's help center 2026-11-05 (support.lucidtrading.com/en/articles/<id>; ids in comments).
# Generated by backend/scripts/make_plans.py. # VERIFY = not stated by Lucid or conflicting — confirm it.
account_size: 100000
purchase: {drawdown_type: eod, dll_enabled: true, consistency_pct: 40}   # Flex eval 40% (50% add-on) 12945805
max_contracts: {minis: 6, micros: 60}                 # 12890029/12945790

eval:
  profit_target: 6000
  consistency_max_day_pct: 40            # 12945805
  min_profitable_days: 3                # 12945790
  max_loss_limit: 3000
  drawdown_type: eod                   # 12890136 / 12945815
  daily_loss_limit: null                # VERIFY Flex DLL amount not stated (on/off at checkout)
  lock_trigger: 103100
  lock_level: 100100
  news_allowed_by_firm: true           # 11404728
  news_breach_min_before: 1
  news_breach_min_after: 1

funded:
  max_loss_limit: 3000
  drawdown_type: eod                   # 12890136 / 12945815
  lock_trigger: 103100
  lock_level: 100100
  daily_loss_limit: null                # VERIFY Flex funded DLL amount not stated
  consistency_max_day_pct: null          # Flex funded: none 12945795
  news_allowed_by_firm: true           # 11404728
  news_breach_min_before: 1
  news_breach_min_after: 1
  max_daily_profit_live_trigger: null  # Pro/Flex: no $-per-day live trigger (review pool after payout 5, 16558826)
  payouts_to_live: 1                   # 16558826: each funded account needs ≥ 1 payout
  payouts_live_review: 5               # 16558826: review pool after payout 5
  scaling: [{profit_from: 0, micros: 30}, {profit_from: 1000, micros: 40}, {profit_from: 2000, micros: 50}, {profit_from: 3000, micros: 60}]   # 12945808 (updated at end of session)
  payout: {split: 0.90, buffer: 100100, min_request: 500, min_cycle_profit: 1, max_first: 2500, max_next: 2500, max_pct_of_profit: 0.5, min_profitable_days: 5, min_day_profit: 200, max_payouts: 5, lock_mll_on_payout: true}   # 12945796, 12945815

live: {starting_balance: 0, max_loss_limit: 3000, drawdown_type: eod, lock_trigger: 3100, lock_level: 100, sim_payout_cap_on_move: 0}   # 16558826 (lock at $100 once profit = start DD) VERIFY

session: {flat_by: "16:45", reopen: "18:00"}                            # VERIFY

behavior:
  # Lucid microscalping rule: flagged if > firm_microscalp_pct % of profits come from trades held
  # <= firm_microscalp_hold_seconds. App-initiated exits (strategy, early exit, manual close in app) wait
  # min_hold_seconds. Protective exits are NEVER delayed: stop-loss, take-profit bracket leg, kill switch,
  # MLL/DLL breach, news flatten, flat times.
  min_hold_seconds: 7.5                # user: hold ≥ 7.5 s before any app exit (Lucid flags ≤ 5 s)
  firm_microscalp_hold_seconds: 5      # VERIFY
  rapid_trade_warn_pct: 20
  firm_microscalp_pct: 50              # VERIFY
  no_hedging: true
  hedge_lock_scope: EQUITY_INDEX
  max_funded_per_household: 5
  max_total_accounts: 10               # VERIFY
  max_open_positions_per_account: 1
  inactivity_alert_days: 21
  firm_inactivity_delete_days: 30      # VERIFY

# D1: MYM (Micro E-mini Dow / "US30", CBOT) and MGC (Micro Gold, COMEX) added — both on Lucid's
# "Approved Products and Commissions" list. Disabled until the §16.6 addition gate passes.
# fee_rt = Lucid commission per side × 2 (MNQ/MYM $0.50/side, MGC $0.80/side) — VERIFY in your dashboard.
# Per-instrument trade-plan overrides fall back to trade_plan.* when absent.
instruments:
  MNQ: {tick: 0.25, tick_value: 0.50, fee_rt: 1.00, enabled: true, group: NQ, super_group: EQUITY_INDEX, bias_proxy: QQQ, exchange: CME, tv_symbol: "MNQ1!", contract: {months: HMUZ, roll: expiry, roll_days: 8}, windows: [["03:00", "09:30"], ["09:35", "15:30"]], trend_filters: false}    # D49: MNQ back on (profitable with the D49 rules on Nov 2024+). VERIFY fees
  MYM: {tick: 1.0, tick_value: 0.50, fee_rt: 1.00, enabled: false, group: YM, super_group: EQUITY_INDEX, bias_proxy: DIA, exchange: CBOT, tv_symbol: "MYM1!", contract: {months: HMUZ, roll: expiry, roll_days: 8}}   # VERIFY fees
  MGC: {tick: 0.10, tick_value: 1.00, fee_rt: 1.60, enabled: false, group: GC, super_group: METALS, bias_proxy: GLD, exchange: COMEX, tv_symbol: "MGC1!", contract: {months: GJMQVZ, roll: fnd, roll_days: 2}, min_stop_ticks: 16, news_after_min: 15, windows: [["03:00", "15:30"]]}      # VERIFY fees

correlation_groups:
  NQ: [NQ, MNQ]
  ES: [ES]
  YM: [YM, MYM]
  RTY: [RTY, M2K]
  GC: [GC, MGC]
super_groups:
  EQUITY_INDEX: [NQ, ES, YM, RTY]
  METALS: [GC]

trade_plan: {rr_min: 1.5, rr_max: 2.5, stop_buffer_ticks: 4, min_stop_ticks: 20, slippage_ticks: 1, one_entry_per_model: true}

strategy:   # D63: per-account auto size (size_table). Previous: D58 (user 2026-11-09): MAIN = NOISE ($250 stop) + afternoon fade (paper first). D55 (user 2026-11-09): NOISE (verified) on; LunqFX + Opening-drive are buttons (Strategy page)
  lunqfx: false
  noise: true
  open_drive: false
  pm_fade: true
  size_table:   # D63 (2026-11-09): automatic micros per account size (+ drawdown brake), research §21–22
    - {account_size: 25000, mll: 1000, contracts: 1}
    - {account_size: 50000, mll: 2000, contracts: 2, brake_below: 0.5, brake_contracts: 1}
    - {account_size: 100000, mll: 3000, contracts: 2, brake_below: 0.3, brake_contracts: 1}
    - {account_size: 150000, mll: 4500, contracts: 4, brake_below: 0.5, brake_contracts: 2}

filters:
  c1_min_range_atr: 0.4                # tunable 0.4–1.0
  htf_atr_period: 14
  model_fail_cooldown: {streak: 3, sessions: 5, in_scalp: false}   # my setting, not Lab-tunable
  require_mso_agree: false            # D36: G4 score-only (blend: confirmation lag killed entries)
  require_structure_break: false      # D36: G5 score-only
  t1_through_ok_with_limit: true      # D36: limit entry needs a full retrace, so T1 touched is fine
  no_break_rr_cap: null               # D47: no 1R targets — every trade aims at 1.75–1.8R (was 1.0, D36)
  trend: {vwap: false, ema200_5m: true, utbot_5m: true, squeeze_5m_15m: false}   # D47 main strategy: UT Bot 5m + EMA200 5m must agree

score:
  weights: {cisd_before_c2_close: 25, choch_after_sweep: 20, bos_only: 10, osc_strength: 15, own_tp_rate: 15, bias_aligned: 15, htf_mso_agrees: 10}
  min_score: 60
  neutral_min_score: 60
  exclude_unknown: true               # D36: unknown bias / unproven T2 rate leave the max
  osc_strength_min: 20
  tp_rate_min: 0.45
  tp_rate_min_samples: 30
  div_lookback_bars: 6
  session_open_c1_weight: 0            # tunable 0–10, only after §16.6
  session_open_times: ["09:30", "13:30"]
  smt_weight: 0                        # tunable 0–15, only after §16.6

entry: {mode: limit_cisd, limit_timeout_bars: 4, max_wait_bars: 6}

profiles:
  TIGHT: {ltf: "1", htf: "15"}
  STD: {ltf: "5", htf: "60"}
  std_min_risk_base: 1500              # tunable 1200–2000

drawdown_guard: {mode: auto, partial_fraction_of_tp: 0.5, partial_qty: ceil_half, runner_trail_r: 2.0, min_contracts_on: 2, min_contracts_off: 1, early_exits_until_r: 1.0}

internal:
  risk_pct_by_score: {60: 0.07, 75: 0.09, 90: 0.11}
  risk_pct_floor: 0.07
  risk_pct_middle: 0.09
  risk_pct_ceiling: 0.11
  risk_pct_absolute_bounds: [0.01, 0.15]
  max_risk_usd: null
  warmup_trades: 20
  day_lockin_r: 2.0
  dd_floor_pct: 20
  streak_floor_losses: 4
  streak_release_wins: 2
  pause_below_risk_base: 2000
  dll_safety_margin: 40
  max_trades_per_day: 3                # D50 (user): at least 2, MAX 3 trades/day per account
  low_risk_max_trades_per_day: 7       # D51 (user): Lower risk mode up to 7/day; normal mode max 3
  max_consecutive_losses_per_day: 2
  internal_max_micros: 40
  kill_switch_mll_distance: 100
  cushion_target_balance: 112100
  cap_guard_total_above_buffer: 10000
  consistency_day_stop_buffer_pct: 5
  consistency_on_funded: false
  funded_consistency_pct: 40
  funded_consistency_reference_min: 6000
  auto_flatten: "16:40"
  hard_flat: "16:44"
  windows: [["06:45", "09:30"], ["09:35", "11:30"], ["13:30", "15:30"]]   # D2 + D10: 09:30–09:35 excluded
  no_entry_before_news_min: 15
  news_flatten_before_min: 2

one_to_one_mode:                       # D7 — user toggle in Risk UI; the Lab may never toggle or tune it
  enabled: false
  rr: 1.0                              # take-profit exactly 1R (replaces the 2–3R window while ON)
  partial_at_fraction_of_tp: 0.75      # take profit on part of the position at 75% of the way to TP
  partial_qty_fraction: 0.5            # 50% of contracts
  max_consecutive_losses_per_day: 3    # ONLY in this mode (normal mode: internal.max_consecutive_losses_per_day = 2)
  max_trades_per_day: 5                # D36: scalp / 1:1 target 4–7 trades/day
  extended_max_trades_per_day: 7                # D36: trades 6–7 only on a win streak
  extend_after_win_streak: 3           # W W W → 4th ok; W W W W → 5th ok; a loss on the 4th ends the day
  breakeven_after_partial: true        # after the 75% partial, the rest's stop → entry + fee cover
  # One contract (can't split): when price reaches 75% of the way to TP, ratchet the stop to lock in
  # single_contract_lock_r of profit (0.30R default, allowed 0.25–0.35R). Ratchet only, never loosens.
  single_contract_lock_r: 0.30
  single_contract_lock_bounds: [0.25, 0.35]
  stages: [EVAL, FUNDED, LIVE]         # D16: user approved LIVE
  # Works for EOD and intraday-trailing accounts; on intraday accounts the partial + stop lock also limits how
  # far open-profit peaks drag the MLL up. While ON, this management replaces the §8 drawdown guard for that trade.
  gate: {min_trades: 100, min_e_net_r: 0.20, min_pf: 1.4, max_violations: 0}   # own backtest before paid accounts
  filters:                             # D38 — user: scalp/1:1 keep the normal trade count (E1–E6 off; E7 kept)
    target_within_t1: false            # E1 off
    t1_rate_min: 0.65                  # E2 off while samples = 0
    t1_rate_min_samples: 0
    min_score: 60                      # E3 = normal minimum
    require_choch: false               # E4 off
    require_bias_and_htf: false        # E5 off
    atr_pct_band: [10, 90]             # E6 off while samples = 0
    atr_pct_min_samples: 0
    news_after_min: 5                  # E7: no 1:1 entries until 5 min after a high-impact release
    # E8 (weak 30-min slices) is a Lab suggestion inside your windows only — Phase 9.
  # Unchanged in this mode: all gates, per-trade DLL/MLL checks (never weakened), kill switch, 40% consistency
  # cap + day stop, hedge lock, news/flat times, min hold, force_floor after a loss, Evaluation Mode scope.

eval_mode:                             # §11C — EVAL stage ONLY
  default_on: false
  applies_to_stages: [EVAL]
  confirm_phrase: "ENABLE EVALUATION MODE"
  risk_pct_by_score: {60: 0.10, 75: 0.12, 90: 0.14}
  risk_pct_floor: 0.10
  risk_pct_middle: 0.12
  risk_pct_ceiling: 0.14
  max_risk_usd: 140
  warmup_trades: 10
  target_sessions: {target: 15, max: 20}
  auto_off_on_stage_change: true
  pace_escalation: false               # never raise risk to catch up
  one_to_one: false                    # D23: use 1:1 plans on EVAL accounts while Evaluation Mode is on

