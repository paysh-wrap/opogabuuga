  unknown: NO_TRADE
  backtest_source: recorded_only

smt: {enabled: false, pair: []}   # D51: Micro S&P removed, so no NQ/ES SMT pair

indicators:                            # docs/INDICATOR_SPEC.md (spec-derived; VERIFY vs original source, D11)
