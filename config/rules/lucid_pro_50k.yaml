trade_plan: {rr_min: 1.5, rr_max: 2.5, stop_buffer_ticks: 4, min_stop_ticks: 20, slippage_ticks: 1, one_entry_per_model: true}

strategy:   # D63: per-account auto size (size_table). Previous: D58 (user 2026-11-09): MAIN = NOISE ($250 stop) + afternoon fade (paper first). D55 (user 2026-11-09): NOISE (verified) on (D105/D107: LunqFX + Opening-drive removed)
  noise: true
  pm_fade: true
  order_flow: false   # D95: Order Flow button (UNVERIFIED, paper accounts only, default OFF)
  order_flow_cfg:   # D96 (user 2026-11-11): MGC on for ORDER FLOW only; instruments.MGC.enabled stays false (every other strategy keeps MGC off). Data: Databento MGC.v.0 (volume roll), never MGC.c.0
    instruments: [MNQ, MGC]
    ar:   # D101 AR Model gates (UNVERIFIED; only remove trades). Env + confirmation always on; location/path = switches
      required: true            # alert without AR fields → OF_NO_CONFIRM
      allowed_envs: [EXPANSION, ROTATION]   # COMPRESSION never trades (OF_COMPRESSION)
      location_filter: true     # session-18 AR study (estimated delta): location did NOT help — re-test on real delta
      fib_min: 0.705            # focus zone 0.705–0.886 of the swing range (bias side); validator: 0.5 ≤ min < max ≤ 0.886
      fib_max: 0.886
      value_side: OUTSIDE_VALUE # LONG below VAL / SHORT above VAH of the swing's fixed-range profile
      path_filter: true         # study: path did NOT help on estimated data — re-test on real delta
      path_block_zone: MAX      # Asia + ATR(20) zone at/beyond which a trade WITH the move is skipped (OF_PATH_EXHAUSTED)
      confirm_max_age_min: 3    # entry (pullback) candle ≤ 3 min after the confirmation candle
      require_real_delta: false # true → delta_source "est" alerts skipped (OF_DELTA_ESTIMATED)
      trail_candle_min: 5       # trail behind the last closed 5m candle (pure helper; not wired yet, D101)
      be_after_r: 1.0           # break-even after 1R follow-through
    ta_advisor: false          # D109 TradingAgents advisor (Order Flow page toggle); advisory only, never blocks unless below
    ta_advisor_blocks: false   # D109 true → opposite-side alert skipped OF_TA_DISAGREES, and only once the AI ledger is proven
    ta_advisor_lead_min: 60    # D109 run the bias job this many minutes before the first Order Flow entry window (ET)
    casper:   # D108 Casper 4h course = REFINEMENTS of the AR Model (UNVERIFIED; each a switch; codes OF_CASPER_<RULE>)
      price_confirms: true      # entry candle closes away from the trapped side (tightens the AR confirmation)
      close_pos_min: 0.5        # validator 0.5–0.9 of the entry candle range on the trade side
      stacked_definition: true  # STACKED_IMBALANCE needs ≥ min_stacked imbalances in a row (tightens)
      min_stacked: 3            # validator 3–6
      cvd_confirm: false        # new filter → OFF: CVD over the last bars must move with the trade
      condition: false          # new filter → OFF: no trade against RTH open vs PRIOR RTH value lean
      inside_value_ok: true
      bunched: false            # new filter → OFF: skip when prior value area < min_va_width_atr × daily ATR(20)
      min_va_width_atr: 0.25
      round_stop: false         # widens the stop → OFF: stop round_buffer_ticks beyond a nearby round number
      round_buffer_ticks: 2     # validator 1–3
      round_step: {MNQ: 50, MGC: 5}
  size_table:   # D63/D64 REGULAR: automatic micros per account size + drawdown brake (research §21–23)
    - {account_size: 25000, mll: 1000, contracts: 1}
    - {account_size: 50000, mll: 2000, contracts: 2, brake_below: 0.5, brake_contracts: 1}
    - {account_size: 100000, mll: 3000, contracts: 2, brake_below: 0.3, brake_contracts: 1}
    - {account_size: 150000, mll: 4500, contracts: 3, brake_below: 0.5, brake_contracts: 2}
  high_risk: false   # D64: Strategy-page button "High risk" → size_table_high
  size_table_high:   # D64 (user 2026-11-09): HIGH RISK — 100K 3 micros, 150K 4 micros (same brake system)
    - {account_size: 25000, mll: 1000, contracts: 1}
    - {account_size: 50000, mll: 2000, contracts: 2, brake_below: 0.5, brake_contracts: 1}
    - {account_size: 100000, mll: 3000, contracts: 3, brake_below: 0.5, brake_contracts: 1}
    - {account_size: 150000, mll: 4500, contracts: 4, brake_below: 0.5, brake_contracts: 2}
  size_table_eval:   # D66 (user 2026-11-09): Evaluation Mode for NOISE + fade — EVAL stage only; agent study §27
    - {account_size: 25000, mll: 1000, contracts: 1}
    - {account_size: 50000, mll: 2000, contracts: 2, brake_below: 0.5, brake_contracts: 1}
    - {account_size: 100000, mll: 3000, contracts: 2, brake_below: 0.3, brake_contracts: 1, grow_per: 1200, max_contracts: 4, day_lock_pct: 0.33}
    - {account_size: 150000, mll: 4500, contracts: 4, brake_below: 0.5, brake_contracts: 2}
  size_table_eval_high:   # D69 (user 2026-11-09): HIGH-RISK evals — 25K: 3 micros × $150 stop ($450 total), 1 micro once < 50% of the target remains (D70)
    - {account_size: 25000, mll: 1000, contracts: 3, stop_usd: 150, taper_below_remaining: 0.5, taper_contracts: 1}
    - {account_size: 50000, mll: 2000, contracts: 2, brake_below: 0.5, brake_contracts: 1}
    - {account_size: 100000, mll: 3000, contracts: 2, brake_below: 0.3, brake_contracts: 1, grow_per: 1200, max_contracts: 4, day_lock_pct: 0.33}
    - {account_size: 150000, mll: 4500, contracts: 4, brake_below: 0.5, brake_contracts: 2}

