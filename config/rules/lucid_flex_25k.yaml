# Paytience rule profile — Lucid Trading LucidFlex 25K
# From Lucid's help center 2026-11-05 (support.lucidtrading.com/en/articles/<id>; ids in comments).
# Generated by backend/scripts/make_plans.py. # VERIFY = not stated by Lucid or conflicting — confirm it.
account_size: 25000
purchase: {drawdown_type: eod, dll_enabled: true, consistency_pct: 40}   # Flex eval 40% (50% add-on) 12945805
max_contracts: {minis: 2, micros: 20}                 # 12890029/12945790

eval:
  profit_target: 1250
  consistency_max_day_pct: 40            # 12945805
  min_profitable_days: 3                # 12945790
  max_loss_limit: 1000
  drawdown_type: eod                   # 12890136 / 12945815
  daily_loss_limit: null                # VERIFY Flex DLL amount not stated (on/off at checkout)
  lock_trigger: 26100
  lock_level: 25100
  news_allowed_by_firm: true           # 11404728
  news_breach_min_before: 1
  news_breach_min_after: 1

funded:
  max_loss_limit: 1000
  drawdown_type: eod                   # 12890136 / 12945815
  lock_trigger: 26100
  lock_level: 25100
  daily_loss_limit: null                # VERIFY Flex funded DLL amount not stated
  consistency_max_day_pct: null          # Flex funded: none 12945795
  news_allowed_by_firm: true           # 11404728
  news_breach_min_before: 1
  news_breach_min_after: 1
  max_daily_profit_live_trigger: null  # Pro/Flex: no $-per-day live trigger (review pool after payout 5, 16558826)
  payouts_to_live: 1                   # 16558826: each funded account needs ≥ 1 payout
  payouts_live_review: 5               # 16558826: review pool after payout 5
  scaling: [{profit_from: 0, micros: 10}, {profit_from: 1000, micros: 20}]   # 12945808 (updated at end of session)
  payout: {split: 0.90, buffer: 25100, min_request: 500, min_cycle_profit: 1, max_first: 1000, max_next: 1000, max_pct_of_profit: 0.5, min_profitable_days: 5, min_day_profit: 100, max_payouts: 5, lock_mll_on_payout: true}   # 12945796, 12945815

live: {starting_balance: 0, max_loss_limit: 1000, drawdown_type: eod, lock_trigger: 1100, lock_level: 100, sim_payout_cap_on_move: 0}   # 16558826 (lock at $100 once profit = start DD) VERIFY

session: {flat_by: "16:45", reopen: "18:00"}                            # VERIFY

behavior:
  # Lucid microscalping rule: flagged if > firm_microscalp_pct % of profits come from trades held
  # <= firm_microscalp_hold_seconds. App-initiated exits (strategy, early exit, manual close in app) wait
  # min_hold_seconds. Protective exits are NEVER delayed: stop-loss, take-profit bracket leg, kill switch,
  # MLL/DLL breach, news flatten, flat times.
  min_hold_seconds: 7.5                # user: hold ≥ 7.5 s before any app exit (Lucid flags ≤ 5 s)
  firm_microscalp_hold_seconds: 5      # VERIFY
  rapid_trade_warn_pct: 20
  firm_microscalp_pct: 50              # VERIFY
  no_hedging: true
  hedge_lock_scope: EQUITY_INDEX
  max_funded_per_household: 5
  max_total_accounts: 10               # VERIFY
  max_open_positions_per_account: 1
  inactivity_alert_days: 21
  firm_inactivity_delete_days: 30      # VERIFY

# D1: MYM (Micro E-mini Dow / "US30", CBOT) and MGC (Micro Gold, COMEX) added — both on Lucid's
# "Approved Products and Commissions" list. Disabled until the §16.6 addition gate passes.
# fee_rt = Lucid commission per side × 2 (MNQ/MYM $0.50/side, MGC $0.80/side) — VERIFY in your dashboard.
# Per-instrument trade-plan overrides fall back to trade_plan.* when absent.
instruments:
  MNQ: {tick: 0.25, tick_value: 0.50, fee_rt: 1.00, enabled: true, group: NQ, super_group: EQUITY_INDEX, bias_proxy: QQQ, exchange: CME, tv_symbol: "MNQ1!", contract: {months: HMUZ, roll: expiry, roll_days: 8}, windows: [["03:00", "09:30"], ["09:35", "15:30"]], trend_filters: false}    # D49: MNQ back on (profitable with the D49 rules on Nov 2024+). VERIFY fees
  MYM: {tick: 1.0, tick_value: 0.50, fee_rt: 1.00, enabled: false, group: YM, super_group: EQUITY_INDEX, bias_proxy: DIA, exchange: CBOT, tv_symbol: "MYM1!", contract: {months: HMUZ, roll: expiry, roll_days: 8}}   # VERIFY fees
  MGC: {tick: 0.10, tick_value: 1.00, fee_rt: 1.60, enabled: false, group: GC, super_group: METALS, bias_proxy: GLD, exchange: COMEX, tv_symbol: "MGC1!", contract: {months: GJMQVZ, roll: fnd, roll_days: 2}, min_stop_ticks: 16, news_after_min: 15, windows: [["03:00", "15:30"]]}      # VERIFY fees

correlation_groups:
  NQ: [NQ, MNQ]
  ES: [ES]
  YM: [YM, MYM]
  RTY: [RTY, M2K]
  GC: [GC, MGC]
super_groups:
  EQUITY_INDEX: [NQ, ES, YM, RTY]
  METALS: [GC]

trade_plan: {rr_min: 1.5, rr_max: 2.5, stop_buffer_ticks: 4, min_stop_ticks: 20, slippage_ticks: 1, one_entry_per_model: true}

strategy:   # D63: per-account auto size (size_table). Previous: D58 (user 2026-11-09): MAIN = NOISE ($250 stop) + afternoon fade (paper first). D55 (user 2026-11-09): NOISE (verified) on (D105/D107: LunqFX + Opening-drive removed)
  # D115 (user 2026-11-11) per-strategy, per-plan size. Every trade still goes through ALL pre-trade checks:
  # firm max micros (Flex: scaling plan), internal_max_micros, the $ caps below, worst case + DLL margin <= DLL left
  # and <= distance to the MLL - kill distance, consistency cap/day stop, split 50/50 halving, household hedge lock.
  # Scale = drawdown ratio vs 25K (MLL 1000 / 1000 = 1x), rounded down; 25K stays at 1 micro (NOISE was
  # verified at 1 micro on 25K; the unverified strategies keep 1 micro on 25K).
  max_trade_risk_usd: 500      # plan per-trade cap for every fixed-size strategy: 50% of the MLL (1000) — one trade never risks half the drawdown
  noise_cfg: {contracts: 1, skip_weekdays: [0], profit_lock_trigger_pts: 100, profit_lock_pts: 10, profit_lock_trigger_alt_pts: 80}         # fallback only — NOISE is sized by size_table below (D63/D64 research, verified)
  pm_fade_cfg: {contracts: 1, eval_off: true}       # fallback only — PM_FADE uses size_table below (same as NOISE)
  # D132 (session 20, B2): NOISE preset C profit lock ON in every plan (+100 pt -> stop to entry +10, as the session-19
  # numbers were measured); Mondays off also apply to the fade. alt trigger 80 pt = Strategy-page toggle noise_lock_alt
  # (EXPERIMENTAL, likely chance). pm_fade_cfg.eval_off: fade OFF on EVAL accounts (shipped_config.md: better pass/bust).
  noise_lock_alt: false
  eval_size_s19: true   # D133 (I1): Evaluation-Mode size rows capped at eval_size_caps (session 19 lowest bust); false = tables as written
  eval_size_caps:
    - {account_size: 100000, max_contracts: 2}   # 100K x2 pass/bust 83/15 vs x3 69/31, x4 58/42 (7.5 yr, Mondays off)
    - {account_size: 150000, max_contracts: 3}   # 150K x3 83/15 vs x4 75/24
  ai_bias_cfg: {contracts: 1, max_risk_usd: null}   # floor(MLL ratio); budget 30% of MLL at the 0.5% stop (25K: none = unchanged); UNVERIFIED
  ai_duo_cfg: {contracts: 1}         # floor(MLL ratio); D85 max_risk_usd $250 per trade (user, all sizes) and 150K max_qty 4 unchanged; UNVERIFIED
  noise: true
  pm_fade: true
  order_flow: false   # D95: Order Flow button (UNVERIFIED, paper accounts only, default OFF)
  order_flow_cfg:   # D96 (user 2026-11-11): MGC on for ORDER FLOW only; instruments.MGC.enabled stays false (every other strategy keeps MGC off). Data: Databento MGC.v.0 (volume roll), never MGC.c.0
    contracts: 1                # D115 risk-based cap: min(contracts, floor(max_risk_usd / per-contract risk at the ATR/absorption stop)); UNVERIFIED → 25K 1 micro
    max_risk_usd: null          # D115 30% of the MLL (25K: none = unchanged; the plan cap above still applies)
    brake_below: 0.5          # D115 1 micro while (equity - MLL) < 50% of the MLL (the size-table brake)
    instruments: [MNQ, MGC]
    ar:   # D101 AR Model gates (UNVERIFIED; only remove trades). Env + confirmation always on; location/path = switches
      required: true            # alert without AR fields → OF_NO_CONFIRM
      allowed_envs: [EXPANSION, ROTATION]   # COMPRESSION never trades (OF_COMPRESSION)
      location_filter: true     # session-18 AR study (estimated delta): location did NOT help — re-test on real delta
      fib_min: 0.705            # focus zone 0.705–0.886 of the swing range (bias side); validator: 0.5 ≤ min < max ≤ 0.886
      fib_max: 0.886
      value_side: OUTSIDE_VALUE # LONG below VAL / SHORT above VAH of the swing's fixed-range profile
      path_filter: true         # study: path did NOT help on estimated data — re-test on real delta
      path_block_zone: MAX      # Asia + ATR(20) zone at/beyond which a trade WITH the move is skipped (OF_PATH_EXHAUSTED)
      confirm_max_age_min: 3    # entry (pullback) candle ≤ 3 min after the confirmation candle
      require_real_delta: false # true → delta_source "est" alerts skipped (OF_DELTA_ESTIMATED)
      trail_candle_min: 5       # trail behind the last closed 5m candle (pure helper; not wired yet, D101)
      be_after_r: 1.0           # break-even after 1R follow-through
    zone_atr:   # D111 ATR-zone Order Flow TYPE (iceberg PROXY, no MBO data; UNVERIFIED; codes OF_ZONE_*)
      enabled: false            # Order Flow page / Strategy page toggle
      modes: [POSITION]         # POSITION and/or REVERSION
      exclusive: false          # true = AR-type alerts do not trade while the zone type is on
      entry_atr_pct: 1.15       # POSITION entry 115% ATR(5m) outside the event zone
      stop_atr_pct: 1.15        # stop back through the zone + 115% ATR beyond; trail only to new events, never BE
      reversion_levels: [1, 2, 3]   # entry k ATR away, target the zone, stop at k+1 (rr_min 1.5 still applies)
      a_plus_only: false        # REVERSION only in front of a prior event
      min_event_size: {MNQ: 150, MGC: 150}   # proxy contracts (NQ / GC thresholds)
      max_risk_ticks: 400       # the ATR stop is wide by design; 1 micro, Lucid DLL/MLL checks still size
      dead_zone_filter: true
      dead_zone: ["11:15", "13:30"]   # ET; needs relative volume >= dead_zone_min_rvol
      dead_zone_min_rvol: 1.5
      last_minutes_filter: true # no new trades in the last N min of RTH
      rth_close: "16:00"
      last_minutes: 10
      price_change_confirm: true   # REVERSION: 5-min range >= price_change_pct x ATR
      price_change_pct: 0.70
      tick_filter: true         # |TICK| >= tick_extreme against the fade = program day (off without a TICK field)
      tick_extreme: 1000
    amt:   # D110 AMT+ Order Flow button (UNVERIFIED; CONTEXT → LOCATION → order flow last; codes OF_AMT_*; only removes trades)
      enabled: false            # Strategy-page button 'AMT+ Order Flow' (My Settings)
      balance_mode: skip        # BALANCE context: skip | edges (LONG only at prior VAL, SHORT only at prior VAH)
      level_filter: true        # signal must form at a key level (else OF_AMT_NO_LEVEL)
      levels: [ETH_VWAP, PRIOR_VAH, PRIOR_VAL, PRIOR_POC, LVN, DELTA_OUTLIER, PRIOR_HIGH, PRIOR_LOW]
      target_to_level: true     # TP = next key level beyond entry when it gives rr_min … target_max_rr, else rr
      target_max_rr: 3.0        # §7 pillar: TP ≤ 3R (validator 1.5–3.0)
    ta_advisor: false          # D109 TradingAgents advisor (Order Flow page toggle); advisory only, never blocks unless below
    ta_advisor_blocks: false   # D109 true → opposite-side alert skipped OF_TA_DISAGREES, and only once the AI ledger is proven
    ta_advisor_lead_min: 60    # D109 run the bias job this many minutes before the first Order Flow entry window (ET)
    casper:   # D108 Casper 4h course = REFINEMENTS of the AR Model (UNVERIFIED; each a switch; codes OF_CASPER_<RULE>)
      price_confirms: true      # entry candle closes away from the trapped side (tightens the AR confirmation)
      close_pos_min: 0.5        # validator 0.5–0.9 of the entry candle range on the trade side
      stacked_definition: true  # STACKED_IMBALANCE needs ≥ min_stacked imbalances in a row (tightens)
      min_stacked: 3            # validator 3–6
      cvd_confirm: false        # new filter → OFF: CVD over the last bars must move with the trade
      condition: false          # new filter → OFF: no trade against RTH open vs PRIOR RTH value lean
      inside_value_ok: true
      bunched: false            # new filter → OFF: skip when prior value area < min_va_width_atr × daily ATR(20)
      min_va_width_atr: 0.25
      round_stop: false         # widens the stop → OFF: stop round_buffer_ticks beyond a nearby round number
      round_buffer_ticks: 2     # validator 1–3
      round_step: {MNQ: 50, MGC: 5}
  size_table:   # D63/D64 REGULAR: automatic micros per account size + drawdown brake (research §21–23)
    - {account_size: 25000, mll: 1000, contracts: 1}
    - {account_size: 50000, mll: 2000, contracts: 2, brake_below: 0.5, brake_contracts: 1}
    - {account_size: 100000, mll: 3000, contracts: 2, brake_below: 0.3, brake_contracts: 1}
    - {account_size: 150000, mll: 4500, contracts: 3, brake_below: 0.5, brake_contracts: 2}
  high_risk: false   # D64: Strategy-page button "High risk" → size_table_high
  suggested_size: false   # D127: Strategy-page toggle — on = size_table_suggested below
  size_table_suggested:   # D127 session-19 lowest-bust sizes (7.5 yr bootstrap bust: 25K×1 28-33 %, 50K×1 6-10 %, 100K×2 15-18 %, 150K×3 15-18 %)
    - {account_size: 25000, mll: 1000, contracts: 1}
    - {account_size: 50000, mll: 2000, contracts: 1}
    - {account_size: 100000, mll: 3000, contracts: 2, brake_below: 0.3, brake_contracts: 1}
    - {account_size: 150000, mll: 4500, contracts: 3, brake_below: 0.5, brake_contracts: 2}
  size_table_high:   # D64 (user 2026-11-09): HIGH RISK — 100K 3 micros, 150K 4 micros (same brake system)
    - {account_size: 25000, mll: 1000, contracts: 1}
    - {account_size: 50000, mll: 2000, contracts: 2, brake_below: 0.5, brake_contracts: 1}
    - {account_size: 100000, mll: 3000, contracts: 3, brake_below: 0.5, brake_contracts: 1}
    - {account_size: 150000, mll: 4500, contracts: 4, brake_below: 0.5, brake_contracts: 2}
  # D122 (user 2026-11-11): dynamic trailing stop + cushion level controls, per-strategy toggles (Strategy page,
  # My Settings), default OFF, UNVERIFIED (no backtest). Tighten-only: never loosens a stop, never raises a size above
  # the size tables / every other check (kill switch, size-table brake, DLL, MLL worst case, consistency).
  dynamic_trail:
    noise: false
    pm_fade: false
    ai_bias: false
    ai_duo: false
    order_flow: false          # ON also wires the D101 Order Flow AR candle trail (AR-type trades)
    activate_r: 1.0            # starts at +1R: stop -> breakeven + fee cover (0.5-3)
    min_distance_ticks: 8      # never closer than this to the market (2-200)
    atr_tf_min: 5              # ATR(atr_period) of 5m bars built from the 1m heartbeat bars (1 or 5)
    atr_period: 14
    swing_tf_min: 5            # swing structure: last closed 5m bar low (LONG) / high (SHORT) +/- 1 tick
    steps:                     # trail = max(k x ATR, swing) behind the best price; k tightens with profit
      - {until_r: 2.0, k: 2.0}
      - {until_r: 3.0, k: 1.5}
      - {until_r: null, k: 1.0}
    low_vol_percentile: 0.25   # current ATR in the lowest 25% of its last low_vol_lookback values = compression
    low_vol_mult: 0.75         # ... then k x 0.75 (tighter)
    low_vol_lookback: 50
    k_floor: 0.5               # k never below this (after the cushion reduction)
  cushion:                     # cushion = equity incl. open P&L - current MLL, as a share of the MLL distance
    noise: false
    pm_fade: false
    ai_bias: false
    ai_duo: false
    order_flow: false
    normal_min: 0.75           # >= 75%: normal
    reduce_min: 0.50           # 50-75%: size -reduce_size_minus micros (min 1), trail k -reduce_k_minus
    minimal_min: 0.25          # 25-50%: 1 micro, trail k -minimal_k_minus, <= minimal_max_trades trades/day; < 25%: STOP
    reduce_size_minus: 1
    reduce_k_minus: 0.25
    minimal_k_minus: 0.5
    minimal_max_trades: 1

filters:
  c1_min_range_atr: 0.4                # tunable 0.4–1.0
  htf_atr_period: 14
  model_fail_cooldown: {streak: 3, sessions: 5, in_scalp: false}   # my setting, not Lab-tunable
  require_mso_agree: false            # D36: G4 score-only (blend: confirmation lag killed entries)
  require_structure_break: false      # D36: G5 score-only
  t1_through_ok_with_limit: true      # D36: limit entry needs a full retrace, so T1 touched is fine
  no_break_rr_cap: null               # D47: no 1R targets — every trade aims at 1.75–1.8R (was 1.0, D36)
  trend: {vwap: false, ema200_5m: true, utbot_5m: true, squeeze_5m_15m: false}   # D47 main strategy: UT Bot 5m + EMA200 5m must agree

score:
  weights: {cisd_before_c2_close: 25, choch_after_sweep: 20, bos_only: 10, osc_strength: 15, own_tp_rate: 15, bias_aligned: 15, htf_mso_agrees: 10}
  min_score: 60
  neutral_min_score: 60
  exclude_unknown: true               # D36: unknown bias / unproven T2 rate leave the max
  osc_strength_min: 20
  tp_rate_min: 0.45
  tp_rate_min_samples: 30
  div_lookback_bars: 6
  session_open_c1_weight: 0            # tunable 0–10, only after §16.6
  session_open_times: ["09:30", "13:30"]
  smt_weight: 0                        # tunable 0–15, only after §16.6

entry: {mode: limit_cisd, limit_timeout_bars: 4, max_wait_bars: 6}

profiles:
  TIGHT: {ltf: "1", htf: "15"}
  STD: {ltf: "5", htf: "60"}
  std_min_risk_base: 1500              # tunable 1200–2000

drawdown_guard: {mode: auto, partial_fraction_of_tp: 0.5, partial_qty: ceil_half, runner_trail_r: 2.0, min_contracts_on: 2, min_contracts_off: 1, early_exits_until_r: 1.0}

internal:
  risk_pct_by_score: {60: 0.07, 75: 0.09, 90: 0.11}
  risk_pct_floor: 0.07
  risk_pct_middle: 0.09
  risk_pct_ceiling: 0.11
  risk_pct_absolute_bounds: [0.01, 0.15]
  max_risk_usd: null
  warmup_trades: 20
  day_lockin_r: 2.0
  dd_floor_pct: 20
  streak_floor_losses: 4
  streak_release_wins: 2
  pause_below_risk_base: 500
  dll_safety_margin: 40
  max_trades_per_day: 3                # D50 (user): at least 2, MAX 3 trades/day per account
  low_risk_max_trades_per_day: 7       # D51 (user): Lower risk mode up to 7/day; normal mode max 3
  max_consecutive_losses_per_day: 2
  internal_max_micros: 10
  kill_switch_mll_distance: 100
  cushion_target_balance: 28100
  cap_guard_total_above_buffer: 10000
  consistency_day_stop_buffer_pct: 5
  consistency_on_funded: false
  funded_consistency_pct: 40
  funded_consistency_reference_min: 1250
  auto_flatten: "16:40"
  hard_flat: "16:44"
  windows: [["06:45", "09:30"], ["09:35", "11:30"], ["13:30", "15:30"]]   # D2 + D10: 09:30–09:35 excluded
  no_entry_before_news_min: 15
  news_flatten_before_min: 2

one_to_one_mode:                       # D7 — user toggle in Risk UI; the Lab may never toggle or tune it
  enabled: false
  rr: 1.0                              # take-profit exactly 1R (replaces the 2–3R window while ON)
  partial_at_fraction_of_tp: 0.75      # take profit on part of the position at 75% of the way to TP
  partial_qty_fraction: 0.5            # 50% of contracts
  max_consecutive_losses_per_day: 3    # ONLY in this mode (normal mode: internal.max_consecutive_losses_per_day = 2)
  max_trades_per_day: 5                # D36: scalp / 1:1 target 4–7 trades/day
  extended_max_trades_per_day: 7                # D36: trades 6–7 only on a win streak
  extend_after_win_streak: 3           # W W W → 4th ok; W W W W → 5th ok; a loss on the 4th ends the day
  breakeven_after_partial: true        # after the 75% partial, the rest's stop → entry + fee cover
  # One contract (can't split): when price reaches 75% of the way to TP, ratchet the stop to lock in
  # single_contract_lock_r of profit (0.30R default, allowed 0.25–0.35R). Ratchet only, never loosens.
  single_contract_lock_r: 0.30
  single_contract_lock_bounds: [0.25, 0.35]
  stages: [EVAL, FUNDED, LIVE]         # D16: user approved LIVE
  # Works for EOD and intraday-trailing accounts; on intraday accounts the partial + stop lock also limits how
  # far open-profit peaks drag the MLL up. While ON, this management replaces the §8 drawdown guard for that trade.
  gate: {min_trades: 100, min_e_net_r: 0.20, min_pf: 1.4, max_violations: 0}   # own backtest before paid accounts
  filters:                             # D38 — user: scalp/1:1 keep the normal trade count (E1–E6 off; E7 kept)
    target_within_t1: false            # E1 off
    t1_rate_min: 0.65                  # E2 off while samples = 0
    t1_rate_min_samples: 0
    min_score: 60                      # E3 = normal minimum
    require_choch: false               # E4 off
    require_bias_and_htf: false        # E5 off
    atr_pct_band: [10, 90]             # E6 off while samples = 0
    atr_pct_min_samples: 0
    news_after_min: 5                  # E7: no 1:1 entries until 5 min after a high-impact release
    # E8 (weak 30-min slices) is a Lab suggestion inside your windows only — Phase 9.
  # Unchanged in this mode: all gates, per-trade DLL/MLL checks (never weakened), kill switch, 40% consistency
  # cap + day stop, hedge lock, news/flat times, min hold, force_floor after a loss, Evaluation Mode scope.

eval_mode:                             # §11C — EVAL stage ONLY
  default_on: false
  applies_to_stages: [EVAL]
  confirm_phrase: "ENABLE EVALUATION MODE"
  risk_pct_by_score: {60: 0.10, 75: 0.12, 90: 0.14}
  risk_pct_floor: 0.10
  risk_pct_middle: 0.12
  risk_pct_ceiling: 0.14
  max_risk_usd: 140
  warmup_trades: 10
  target_sessions: {target: 15, max: 20}
  auto_off_on_stage_change: true
  pace_escalation: false               # never raise risk to catch up
  one_to_one: false                    # D23: use 1:1 plans on EVAL accounts while Evaluation Mode is on

fast_eval:                             # D87 Fast Evaluation — EVAL stage ONLY (non-negotiable 10), default OFF, PAPER
  default_on: false                    # master switch OFF: enabled on the Risk page (typed phrase) — NOT a rule value
  applies_to_stages: [EVAL]
  confirm_phrase: "ENABLE FAST EVALUATION"
  pace_escalation: false               # no martingale: size never rises after a loss
  ladder:                              # VERIFY not a study pick for this plan, kept OFF - 1. cushion size ladder
    enabled: false
    steps: [{cushion_frac: 0.5, extra: 1}]
    max_contracts: 2
  harvest:                             # VERIFY not a study pick for this plan, kept OFF - 2. day-cap harvesting (study: no measured benefit)
    enabled: false
    day_stop_pct_of_target: 35
  early:                               # VERIFY not a study pick for this plan, kept OFF - 3. early-evaluation tier (study: no measured benefit)
    enabled: false
    first_trades: 10
    until_profit_frac: 0.5
    cushion_frac: 0.5
    risk_pct: 0.14
    extra_contracts: 1
  quality_day:                         # VERIFY not a study pick for this plan, kept OFF - 4. quality-day filter
    enabled: false
    mode: prev_day
    trailing_days: 10

bias:
  provider: tradingagents
  pinned_version: "0.7.1"                # tag v0.7.1, commit 3e44faafa042daf953f6ec2422ae36bb1fd4f50f
  pinned_commit: "3e44faafa042daf953f6ec2422ae36bb1fd4f50f"
  repo_url: "https://github.com/TauricResearch/TradingAgents"
  proxy: {NQ: QQQ, ES: SPY, YM: DIA, GC: GLD}
  timeout_min: 10
  rating_map: {BUY: LONG_ONLY, OVERWEIGHT: NEUTRAL, HOLD: NEUTRAL, UNDERWEIGHT: NEUTRAL, SELL: SHORT_ONLY}   # D50 (user): block a side only on strong calls
  unknown: NO_TRADE
  backtest_source: recorded_only

smt: {enabled: false, pair: []}   # D51: Micro S&P removed, so no NQ/ES SMT pair

indicators:                            # docs/INDICATOR_SPEC.md (spec-derived; VERIFY vs original source, D11)
  require_c2_close_inside_c1: true     # pillar — must stay true
  mso: {enabled: false, pivot_left: 5, pivot_right: 5, mom_length: 14, smooth_length: 10, div_pivot_left: 5, div_pivot_right: 5}   # = BigBeluga defaults (verified); D91: enabled=false in every offered plan (legacy Daily keeps true as the MSO test baseline)

webhook:
  heartbeat_max_age_s: 30              # §5.4 reject older HEARTBEAT (age from bar close)
  event_max_age_s: 90                  # §5.4 reject older events
  max_future_skew_s: 5
  rate_limit_per_min: 300
  max_body_bytes: 16384
  stale_after_bar_multiple: 2          # no heartbeat for 2× bar interval in session → STALE

schedule:                              # ET; D34: before gold's 03:00 London window (was 06:00/06:10/06:40)
  reconcile_reset: "18:00"
  calendar: "02:30"
  bias: "02:40"
  preflight: "02:50"
  sync: ["18:00", "16:50"]
  sync_every_min: 15
  report: "17:00"
  payouts: "Fri 17:05"
  eod_update: "16:50"                  # EOD-trailing MLL update on the settled balance (after hard flat)
  nightly_backtest: "17:15"
  lab_cycle: "Sat 08:00"

automation:
  default_mode: "OFF"
  accounts_to_trade: 5
  selection_mode: priority
  semi_auto_sessions_per_stage: 5
  auto_arm_new_accounts: false
  require_external_attestation: true
  auto_resume_after_recovery: {paper: true, live: false}

payouts:
  frequency: weekly                    # weekly (Fri) | on_demand
  check_time: "Fri 17:05"
  sweep_above: 28100
  skim_mode: half                      # half | off
  block_trading_while_pending: true

purchase_gate: {min_trades: 100, min_e_net_r: 0.20, min_pf: 1.4, max_violations: 0, demo_days: 2, semi_auto_sessions: 5}

plan:
  annual_target_net: 70000
  annual_floor_net: 50000
  tools_annual: 1500
  eval_cost_per_account: 190
  trades_per_year_assumed: 250
  r_avg_assumed: 255                   # $ per 1R (assumption S3, confirm)

self_improvement: {enabled: true, auto_promote_paper: false, cooldown_days: 14, min_oos_trades: 100, min_improvement_r: 0.03, max_param_step_pct: 25}

scalp_mode: {enabled: false, target_r: 0.5, max_hold_s: 60, runner_r: 2.0, trail_r: 0.5}   # user button: quick trades (1:1 filters + time limit)


reliability:                           # session 14: restart recovery, lost-signal replay, feed-loss protection
  feed_guard_enabled: true             # position open + no 1-minute bar: warn, then flatten (reason FEED_LOST)
  feed_warn_min: 3                     # no bar for this long -> error alert + new entries blocked
  feed_flatten_min: 6                  # no bar for this long -> flatten (protective exit, never waits)
  reprocess_window_min: 5              # unprocessed heartbeats this recent are replayed (exits/management only)
  missed_check_alert_s: 90             # NOISE check minute with no stored bar this long after it closed -> alert
  hedge_inflight_s: 120                # B5: hedge lock also counts our own trades sent this recently (broker may lag)
