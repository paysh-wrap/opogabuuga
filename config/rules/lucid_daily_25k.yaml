# Paytience rule profile — Lucid Trading LucidDaily 25K (Master Prompt v9.2 §23 + docs/DECISIONS.md)
# Checked 2026-11-05 against Lucid's help center (docs/LUCID_RULES.md). VERIFY badges stay until YOU confirm them.
# Any line marked "# VERIFY" shows a gold badge in the UI until confirmed via Risk → Firm Rules.
account_size: 25000
purchase: {drawdown_type: eod, dll_enabled: true, consistency_pct: 40}   # VERIFY
max_contracts: {minis: 2, micros: 20}                                   # VERIFY

eval:
  profit_target: 1250
  consistency_max_day_pct: 40          # VERIFY
  min_profitable_days: 3
  max_loss_limit: 1000                 # VERIFY
  drawdown_type: eod
  daily_loss_limit: 600                # VERIFY
  lock_trigger: 26100                  # VERIFY
  lock_level: 25100                    # VERIFY
  news_allowed_by_firm: false          # VERIFY
  news_breach_min_before: 1
  news_breach_min_after: 1

funded:
  max_loss_limit: 1000
  drawdown_type: intraday              # VERIFY — Lucid help center 15998425: "LucidDaily funded accounts always use an Intraday drawdown" (D20)
  lock_trigger: 26100
  lock_level: 25100
  daily_loss_limit: 600                # VERIFY
  consistency_max_day_pct: null
  news_breach_min_before: 1
  news_breach_min_after: 1
  max_daily_profit_live_trigger: 6000
  payouts_to_live: 1                   # user-confirmed: 1 payout qualifies; move is at Lucid risk team discretion
  payouts_live_review: 5               # user-confirmed: 5th payout enters the live review pool (not required)
  payout: {split: 0.90, buffer: 26100, min_request: 500, min_cycle_profit: 1}   # VERIFY all

live: {starting_balance: 0, max_loss_limit: 1000, drawdown_type: eod, lock_trigger: 1100, lock_level: 100, sim_payout_cap_on_move: 15000}   # VERIFY all

session: {flat_by: "16:45", reopen: "18:00"}                            # VERIFY

behavior:
  # Lucid microscalping rule: flagged if > firm_microscalp_pct % of profits come from trades held
  # <= firm_microscalp_hold_seconds. App-initiated exits (strategy, early exit, manual close in app) wait
  # min_hold_seconds. Protective exits are NEVER delayed: stop-loss, take-profit bracket leg, kill switch,
  # MLL/DLL breach, news flatten, flat times.
  min_hold_seconds: 7.5                # user: hold ≥ 7.5 s before any app exit (Lucid flags ≤ 5 s)
  firm_microscalp_hold_seconds: 5      # VERIFY
  rapid_trade_warn_pct: 20
  firm_microscalp_pct: 50              # VERIFY
  no_hedging: true
  hedge_lock_scope: EQUITY_INDEX
  max_funded_per_household: 5
  max_total_accounts: 10               # VERIFY
  max_open_positions_per_account: 1
  inactivity_alert_days: 21
  firm_inactivity_delete_days: 30      # VERIFY

# D1: MYM (Micro E-mini Dow / "US30", CBOT) and MGC (Micro Gold, COMEX) added — both on Lucid's
# "Approved Products and Commissions" list. Disabled until the §16.6 addition gate passes.
# fee_rt = Lucid commission per side × 2 (MNQ/MES/MYM $0.50/side, MGC $0.80/side) — VERIFY in your dashboard.
# Per-instrument trade-plan overrides fall back to trade_plan.* when absent.
instruments:
  MNQ: {tick: 0.25, tick_value: 0.50, fee_rt: 1.00, enabled: true, group: NQ, super_group: EQUITY_INDEX, bias_proxy: QQQ, exchange: CME, tv_symbol: "MNQ1!", contract: {months: HMUZ, roll: expiry, roll_days: 8}}    # VERIFY fees
  MES: {tick: 0.25, tick_value: 1.25, fee_rt: 1.00, enabled: false, group: ES, super_group: EQUITY_INDEX, bias_proxy: SPY, exchange: CME, tv_symbol: "MES1!", contract: {months: HMUZ, roll: expiry, roll_days: 8}}   # VERIFY fees
  MYM: {tick: 1.0, tick_value: 0.50, fee_rt: 1.00, enabled: false, group: YM, super_group: EQUITY_INDEX, bias_proxy: DIA, exchange: CBOT, tv_symbol: "MYM1!", contract: {months: HMUZ, roll: expiry, roll_days: 8}}   # VERIFY fees
  MGC: {tick: 0.10, tick_value: 1.00, fee_rt: 1.60, enabled: false, group: GC, super_group: METALS, bias_proxy: GLD, exchange: COMEX, tv_symbol: "MGC1!", contract: {months: GJMQVZ, roll: fnd, roll_days: 2}, min_stop_ticks: 16, news_after_min: 15, windows: [["03:00", "11:00"], ["13:30", "15:30"]]}      # VERIFY fees

correlation_groups:
  NQ: [NQ, MNQ]
  ES: [ES, MES]
  YM: [YM, MYM]
  RTY: [RTY, M2K]
  GC: [GC, MGC]
super_groups:
  EQUITY_INDEX: [NQ, ES, YM, RTY]
  METALS: [GC]

trade_plan: {rr_min: 1.75, rr_max: 3.0, stop_buffer_ticks: 4, min_stop_ticks: 20, slippage_ticks: 1, one_entry_per_model: true}

filters:
  c1_min_range_atr: 0.6                # tunable 0.4–1.0
  htf_atr_period: 14
  model_fail_cooldown: {streak: 3, sessions: 5}   # my setting, not Lab-tunable

score:
  weights: {cisd_before_c2_close: 25, choch_after_sweep: 20, bos_only: 10, osc_strength: 15, own_tp_rate: 15, bias_aligned: 15, htf_mso_agrees: 10}
  min_score: 60
  neutral_min_score: 75
  osc_strength_min: 15
  tp_rate_min: 0.45
  tp_rate_min_samples: 30
  div_lookback_bars: 6
  session_open_c1_weight: 0            # tunable 0–10, only after §16.6
  session_open_times: ["09:30", "13:30"]
  smt_weight: 0                        # tunable 0–15, only after §16.6

entry: {mode: market, limit_timeout_bars: 4, max_wait_bars: 6}

profiles:
  TIGHT: {ltf: "1", htf: "15"}
  STD: {ltf: "5", htf: "60"}
  std_min_risk_base: 1500              # tunable 1200–2000

drawdown_guard: {mode: auto, partial_fraction_of_tp: 0.5, partial_qty: ceil_half, runner_trail_r: 2.0, min_contracts_on: 2, min_contracts_off: 1, early_exits_until_r: 1.0}

internal:
  risk_pct_by_score: {60: 0.07, 75: 0.09, 90: 0.11}
  risk_pct_floor: 0.07
  risk_pct_middle: 0.09
  risk_pct_ceiling: 0.11
  risk_pct_absolute_bounds: [0.01, 0.15]
  max_risk_usd: null
  warmup_trades: 20
  day_lockin_r: 2.0
  dd_floor_pct: 20
  streak_floor_losses: 4
  streak_release_wins: 2
  pause_below_risk_base: 500
  dll_safety_margin: 40
  max_trades_per_day: 3                # Aggressive preset: 4
  max_consecutive_losses_per_day: 2
  internal_max_micros: 10
  kill_switch_mll_distance: 100
  cushion_target_balance: 28100
  cap_guard_total_above_buffer: 10000
  consistency_day_stop_buffer_pct: 5
  consistency_on_funded: true          # D16: your own limit on FUNDED (Lucid has none there)
  funded_consistency_pct: 40
  funded_consistency_reference_min: 1250   # cap = 40% × max(this, payout-cycle profit so far)
  auto_flatten: "16:40"
  hard_flat: "16:44"
  windows: [["06:45", "09:30"], ["09:35", "11:30"], ["13:30", "15:30"]]   # D2 + D10: 09:30–09:35 excluded
  no_entry_before_news_min: 15
  news_flatten_before_min: 2

one_to_one_mode:                       # D7 — user toggle in Risk UI; the Lab may never toggle or tune it
  enabled: false
  rr: 1.0                              # take-profit exactly 1R (replaces the 2–3R window while ON)
  partial_at_fraction_of_tp: 0.75      # take profit on part of the position at 75% of the way to TP
  partial_qty_fraction: 0.5            # 50% of contracts
  max_consecutive_losses_per_day: 3    # ONLY in this mode (normal mode: internal.max_consecutive_losses_per_day = 2)
  max_trades_per_day: 3
  extended_max_trades_per_day: 5       # trades 4–5 allowed only while the current win streak is >= 3
  extend_after_win_streak: 3           # W W W → 4th ok; W W W W → 5th ok; a loss on the 4th ends the day
  breakeven_after_partial: true        # after the 75% partial, the rest's stop → entry + fee cover
  # One contract (can't split): when price reaches 75% of the way to TP, ratchet the stop to lock in
  # single_contract_lock_r of profit (0.30R default, allowed 0.25–0.35R). Ratchet only, never loosens.
  single_contract_lock_r: 0.30
  single_contract_lock_bounds: [0.25, 0.35]
  stages: [EVAL, FUNDED, LIVE]         # D16: user approved LIVE
  # Works for EOD and intraday-trailing accounts; on intraday accounts the partial + stop lock also limits how
  # far open-profit peaks drag the MLL up. While ON, this management replaces the §8 drawdown guard for that trade.
  gate: {min_trades: 100, min_e_net_r: 0.20, min_pf: 1.4, max_violations: 0}   # own backtest before paid accounts
  filters:                             # D16 — approved win-rate filters (1:1 mode only; stricter-only)
    target_within_t1: true             # E1: the 1R target must sit at or before the model's T1
    t1_rate_min: 0.65                  # E2: this symbol+profile's models reach T1 at least this often…
    t1_rate_min_samples: 30            #     …measured over at least this many resolved models (else no trade)
    min_score: 75                      # E3
    require_choch: true                # E4: CHoCH after the sweep (BoS alone is not enough)
    require_bias_and_htf: true         # E5: bias aligned (no NEUTRAL) and HTF structure agrees
    atr_pct_band: [10, 90]             # E6: skip when HTF ATR is in its top/bottom 10% …
    atr_pct_min_samples: 30            #     …of recorded values (else no trade)
    news_after_min: 5                  # E7: no 1:1 entries until 5 min after a high-impact release
    # E8 (weak 30-min slices) is a Lab suggestion inside your windows only — Phase 9.
  # Unchanged in this mode: all gates, per-trade DLL/MLL checks (never weakened), kill switch, 40% consistency
  # cap + day stop, hedge lock, news/flat times, min hold, force_floor after a loss, Evaluation Mode scope.

eval_mode:                             # §11C — EVAL stage ONLY
  default_on: false
  applies_to_stages: [EVAL]
  confirm_phrase: "ENABLE EVALUATION MODE"
  risk_pct_by_score: {60: 0.10, 75: 0.12, 90: 0.14}
  risk_pct_floor: 0.10
  risk_pct_middle: 0.12
  risk_pct_ceiling: 0.14
  max_risk_usd: 140
  warmup_trades: 10
  target_sessions: {target: 15, max: 20}
  auto_off_on_stage_change: true
  pace_escalation: false               # never raise risk to catch up
  one_to_one: false                    # D23: use 1:1 plans on EVAL accounts while Evaluation Mode is on

fast_eval:                             # D87 Fast Evaluation — EVAL stage ONLY (non-negotiable 10), default OFF, PAPER
  default_on: false                    # master switch OFF: enabled on the Risk page (typed phrase) — NOT a rule value
  applies_to_stages: [EVAL]
  confirm_phrase: "ENABLE FAST EVALUATION"
  pace_escalation: false               # no martingale: size never rises after a loss
  ladder:                              # VERIFY not a study pick for this plan, kept OFF - 1. cushion size ladder
    enabled: false
    steps: [{cushion_frac: 0.5, extra: 1}]
    max_contracts: 2
  harvest:                             # VERIFY not a study pick for this plan, kept OFF - 2. day-cap harvesting (study: no measured benefit)
    enabled: false
    day_stop_pct_of_target: 35
  early:                               # VERIFY not a study pick for this plan, kept OFF - 3. early-evaluation tier (study: no measured benefit)
    enabled: false
    first_trades: 10
    until_profit_frac: 0.5
    cushion_frac: 0.5
    risk_pct: 0.14
    extra_contracts: 1
  quality_day:                         # VERIFY not a study pick for this plan, kept OFF - 4. quality-day filter
    enabled: false
    mode: prev_day
    trailing_days: 10

bias:
  provider: tradingagents
  pinned_version: "0.7.1"                # tag v0.7.1, commit 3e44faafa042daf953f6ec2422ae36bb1fd4f50f
  pinned_commit: "3e44faafa042daf953f6ec2422ae36bb1fd4f50f"
  repo_url: "https://github.com/TauricResearch/TradingAgents"
  proxy: {NQ: QQQ, ES: SPY, YM: DIA, GC: GLD}
  timeout_min: 10
  rating_map: {BUY: LONG_ONLY, OVERWEIGHT: LONG_ONLY, HOLD: NEUTRAL, UNDERWEIGHT: SHORT_ONLY, SELL: SHORT_ONLY}
  unknown: NO_TRADE
  backtest_source: recorded_only

smt: {enabled: false, pair: [MNQ, MES]}

indicators:                            # docs/INDICATOR_SPEC.md (spec-derived; VERIFY vs original source, D11)
  require_c2_close_inside_c1: true     # pillar — must stay true
  mso: {enabled: true, pivot_left: 5, pivot_right: 5, mom_length: 14, smooth_length: 10, div_pivot_left: 5, div_pivot_right: 5}   # = BigBeluga defaults (verified); D91: enabled=false in every offered plan (legacy Daily keeps true as the MSO test baseline)

webhook:
  heartbeat_max_age_s: 30              # §5.4 reject older HEARTBEAT (age from bar close)
  event_max_age_s: 90                  # §5.4 reject older events
  max_future_skew_s: 5
  rate_limit_per_min: 300
  max_body_bytes: 16384
  stale_after_bar_multiple: 2          # no heartbeat for 2× bar interval in session → STALE

schedule:                              # ET; D34: before gold's 03:00 London window (was 06:00/06:10/06:40)
  reconcile_reset: "18:00"
  calendar: "02:30"
  bias: "02:40"
  preflight: "02:50"
  sync: ["18:00", "16:50"]
  sync_every_min: 15
  report: "17:00"
  payouts: "Fri 17:05"
  eod_update: "16:50"                  # EOD-trailing MLL update on the settled balance (after hard flat)
  nightly_backtest: "17:15"
  lab_cycle: "Sat 08:00"

automation:
  default_mode: "OFF"
  accounts_to_trade: 5
  selection_mode: priority
  semi_auto_sessions_per_stage: 5
  auto_arm_new_accounts: false
  require_external_attestation: true
  auto_resume_after_recovery: {paper: true, live: false}

payouts:
  frequency: weekly                    # weekly (Fri) | on_demand
  check_time: "Fri 17:05"
  sweep_above: 28100                   # = cushion_target_balance
  skim_mode: half                      # half | off
  block_trading_while_pending: true

purchase_gate: {min_trades: 100, min_e_net_r: 0.20, min_pf: 1.4, max_violations: 0, demo_days: 2, semi_auto_sessions: 5}

plan:
  annual_target_net: 70000
  annual_floor_net: 50000
  tools_annual: 1500
  eval_cost_per_account: 190
  trades_per_year_assumed: 250
  r_avg_assumed: 255                   # $ per 1R (assumption S3, confirm)

self_improvement: {enabled: true, auto_promote_paper: false, cooldown_days: 14, min_oos_trades: 100, min_improvement_r: 0.03, max_param_step_pct: 25}

scalp_mode: {enabled: false, target_r: 0.5, max_hold_s: 60, runner_r: 2.0, trail_r: 0.5}   # user button: quick trades (1:1 filters + time limit)


reliability:                           # session 14: restart recovery, lost-signal replay, feed-loss protection
  feed_guard_enabled: true             # position open + no 1-minute bar: warn, then flatten (reason FEED_LOST)
  feed_warn_min: 3                     # no bar for this long -> error alert + new entries blocked
  feed_flatten_min: 6                  # no bar for this long -> flatten (protective exit, never waits)
  reprocess_window_min: 5              # unprocessed heartbeats this recent are replayed (exits/management only)
  missed_check_alert_s: 90             # NOISE check minute with no stored bar this long after it closed -> alert

strategy:   # D101: Order Flow AR-Model defaults (legacy Daily plan: everything else = code defaults)
  order_flow_cfg:
    ar:   # D101 AR Model gates (UNVERIFIED; only remove trades). Env + confirmation always on; location/path = switches
      required: true            # alert without AR fields → OF_NO_CONFIRM
      allowed_envs: [EXPANSION, ROTATION]   # COMPRESSION never trades (OF_COMPRESSION)
      location_filter: true     # session-18 AR study (estimated delta): location did NOT help — re-test on real delta
      fib_min: 0.705            # focus zone 0.705–0.886 of the swing range (bias side); validator: 0.5 ≤ min < max ≤ 0.886
      fib_max: 0.886
      value_side: OUTSIDE_VALUE # LONG below VAL / SHORT above VAH of the swing's fixed-range profile
      path_filter: true         # study: path did NOT help on estimated data — re-test on real delta
      path_block_zone: MAX      # Asia + ATR(20) zone at/beyond which a trade WITH the move is skipped (OF_PATH_EXHAUSTED)
      confirm_max_age_min: 3    # entry (pullback) candle ≤ 3 min after the confirmation candle
      require_real_delta: false # true → delta_source "est" alerts skipped (OF_DELTA_ESTIMATED)
      trail_candle_min: 5       # trail behind the last closed 5m candle (pure helper; not wired yet, D101)
      be_after_r: 1.0           # break-even after 1R follow-through
    casper:   # D108 Casper 4h course = REFINEMENTS of the AR Model (UNVERIFIED; each a switch; codes OF_CASPER_<RULE>)
      price_confirms: true      # entry candle closes away from the trapped side (tightens the AR confirmation)
      close_pos_min: 0.5        # validator 0.5–0.9 of the entry candle range on the trade side
      stacked_definition: true  # STACKED_IMBALANCE needs ≥ min_stacked imbalances in a row (tightens)
      min_stacked: 3            # validator 3–6
      cvd_confirm: false        # new filter → OFF: CVD over the last bars must move with the trade
      condition: false          # new filter → OFF: no trade against RTH open vs PRIOR RTH value lean
      inside_value_ok: true
      bunched: false            # new filter → OFF: skip when prior value area < min_va_width_atr × daily ATR(20)
      min_va_width_atr: 0.25
      round_stop: false         # widens the stop → OFF: stop round_buffer_ticks beyond a nearby round number
      round_buffer_ticks: 2     # validator 1–3
      round_step: {MNQ: 50, MGC: 5}
